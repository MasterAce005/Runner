name: 1-Shot Release Watcher

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: runner-watcher-oneshot
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  check-new-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Nyaa RSS & Dispatch New Episodes
        run: |
          set +x
          git clone --depth 1 https://${{ secrets.VAULT_PAT }}@github.com/${{ secrets.VAULT_REPO }}.git vault_core
          cd vault_core
          npm install --production
          export GITHUB_TOKEN="${{ secrets.VAULT_PAT }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export MAL_CLIENT_ID="${{ secrets.MAL_CLIENT_ID }}"
          node scripts/watcher.mjs
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
          VAULT_REPO: ${{ secrets.VAULT_REPO }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
