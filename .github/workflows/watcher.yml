name: 24/7 Watcher Daemon

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: runner-watcher-24-7
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-stealth-watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mount Vault in Memory & Execute 5-Hour Watcher
        run: |
          set +x
          echo "[VAULT] Securely mounting engine modules in runner memory..."
          git clone --depth 1 https://${{ secrets.VAULT_PAT }}@github.com/${{ secrets.VAULT_REPO }}.git vault_core
          cd vault_core
          npm install --production
          echo "[VAULT] Core mounted successfully. Starting autonomous watcher..."
          export GITHUB_TOKEN="${{ secrets.VAULT_PAT }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export MAL_CLIENT_ID="${{ secrets.MAL_CLIENT_ID }}"
          node scripts/watcher.mjs
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
          VAULT_REPO: ${{ secrets.VAULT_REPO }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}

      - name: Cool-off Pause (Exact 5 Minutes Gap)
        run: |
          echo "5-Hour cycle completed. Entering 5-minute cool-off period..."
          sleep 300
          echo "Cool-off complete. Triggering next 5-hour cycle..."

      - name: Self-Dispatch Next 5-Hour Cycle
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'watcher.yml',
              ref: 'main'
            });
