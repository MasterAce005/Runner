name: Episode Timestamp Extractor Engine

on:
  repository_dispatch:
    types: [extract_new_episodes]
  workflow_dispatch:
    inputs:
      raw_payload:
        description: 'JSON array of episode tasks or single task'
        required: false
        default: '[]'

permissions:
  actions: write
  contents: read

jobs:
  extract-batch:
    runs-on: ubuntu-latest
    steps:

      - name: Start Cloudflare WARP (Proxy Mode Only - MegaUp & ReAnime)
        if: ${{ contains(github.event_name == 'repository_dispatch' && toJson(github.event.client_payload.items) || inputs.raw_payload, 'megaup') || contains(github.event_name == 'repository_dispatch' && toJson(github.event.client_payload.items) || inputs.raw_payload, 'reanime') }}
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list > /dev/null
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/cloudflare-client.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 10); do
            if curl -fsS --max-time 3 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "WARP Proxy ready on 127.0.0.1:40000"
              break
            fi
            sleep 1
          done

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Extraction in Docker using Host Network
        run: |
          docker run --rm --network host \
            -e TASK_PAYLOAD="$TASK_PAYLOAD" \
            -e WARP_PROXY="socks5h://127.0.0.1:40000" \
            -e VAULT_PAT="${{ secrets.VAULT_PAT }}" \
            -e VAULT_REPO="${{ secrets.VAULT_REPO }}" \
            -e MAL_CLIENT_ID="${{ secrets.MAL_CLIENT_ID }}" \
            -e TORBOX_API_KEY="${{ secrets.TORBOX_API_KEY }}" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            ghcr.io/masterace005/runner:latest sh -c '
              set +x
              echo "[VAULT] Securely mounting engine modules in runner memory..."
              git clone --depth 1 https://$VAULT_PAT@github.com/$VAULT_REPO.git vault_core
              cd vault_core
              npm install --production

              # Run Extraction Engine
              node scripts/extract.mjs

              # Sync & Push results
              RESULT_FILES=$(find temp -name "result_*.json" 2>/dev/null)
              if [ -n "$RESULT_FILES" ]; then
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git remote set-url origin https://$VAULT_PAT@github.com/$VAULT_REPO.git

                node scripts/sync_commit.mjs || true
                node scripts/backup_telegram.mjs || true
              fi
            '
        env:
          TASK_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload.items) || inputs.raw_payload }}
